<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Face Simulator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed studio viewport; a camera-style control rail on the right
   (bottom sheet on phones); viewfinder readouts float over the image. */
:root {
  color-scheme: dark;
  --studio: #0d0c0e;        /* backdrop black, faint warm bias */
  --rail: #151417;          /* control rail */
  --rail-2: #1d1b20;        /* raised controls */
  --line: #2a282e;          /* hairlines */
  --ink: #ece8e2;           /* primary text */
  --ink-2: #9c97a0;         /* secondary text */
  --tungsten: #e5a65a;      /* modeling-lamp amber accent */
  --tungsten-dim: #6b4f2e;
  --focus: #f3c98f;
  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --rail-w: 340px;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--studio); color: var(--ink);
  font: 400 14px/1.45 var(--f-display); font-stretch: 100%;
  overflow: hidden;
}
#stage { position: fixed; inset: 0 var(--rail-w) 0 0; }
#view { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#view:active { cursor: grabbing; }

/* Viewfinder readouts */
.vf { position: absolute; pointer-events: none; font-family: var(--f-mono); font-size: 12px; color: var(--ink); letter-spacing: 0.02em; text-shadow: 0 1px 2px #000a; }
.vf-top { top: calc(14px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); display: flex; gap: 18px; align-items: baseline; flex-wrap: wrap; right: 16px; }
.vf-top .name { font-family: var(--f-display); font-stretch: 118%; font-weight: 650; font-size: 15px; letter-spacing: 0.04em; text-transform: uppercase; }
.vf-top .name b { color: var(--tungsten); font-weight: 650; }
.vf-top .read { display: flex; gap: 14px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.vf-top .read span strong { color: var(--ink); font-weight: 500; }
.vf-bottom { bottom: calc(14px + env(safe-area-inset-bottom, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); color: var(--ink-2); font-size: 11px; }
.frame-marks { position: absolute; inset: 9%; pointer-events: none; }
.frame-marks i { position: absolute; width: 18px; height: 18px; border-color: #ffffff30; border-style: solid; border-width: 0; }
.frame-marks i:nth-child(1) { top: 0; left: 0; border-top-width: 1px; border-left-width: 1px; }
.frame-marks i:nth-child(2) { top: 0; right: 0; border-top-width: 1px; border-right-width: 1px; }
.frame-marks i:nth-child(3) { bottom: 0; left: 0; border-bottom-width: 1px; border-left-width: 1px; }
.frame-marks i:nth-child(4) { bottom: 0; right: 0; border-bottom-width: 1px; border-right-width: 1px; }

/* Loading */
#loading { position: absolute; inset: 0; display: grid; place-items: center; background: var(--studio); transition: opacity .6s ease; }
#loading.done { opacity: 0; pointer-events: none; }
#loading .box { display: grid; gap: 10px; justify-items: center; text-align: center; padding-inline: 16px; }
#loading .lamp { width: 44px; height: 44px; border-radius: 50%; background: radial-gradient(circle at 50% 45%, var(--focus), var(--tungsten) 40%, transparent 70%); animation: warm 1.6s ease-in-out infinite alternate; }
#loading .msg { font-family: var(--f-mono); font-size: 12px; color: var(--ink-2); }
#loading .err { color: var(--focus); max-width: 46ch; font-size: 13px; }
@keyframes warm { from { opacity: .45; transform: scale(.92); } to { opacity: 1; transform: scale(1); } }

/* Control rail */
#rail {
  position: fixed; top: 0; right: 0; bottom: 0; width: var(--rail-w);
  background: var(--rail); border-left: 1px solid var(--line);
  display: grid; grid-template-rows: auto auto 1fr; min-height: 0;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-right: env(safe-area-inset-right, 0px);
}
.rail-head { padding: 16px 18px 10px; display: grid; gap: 2px; }
.rail-head h1 { margin: 0; font-size: 13px; font-stretch: 70%; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-2); }
.rail-head p { margin: 0; font-size: 12px; color: var(--ink-2); max-width: 44ch; }
.tabs { display: grid; grid-template-columns: repeat(5, 1fr); border-block: 1px solid var(--line); }
.tabs button {
  appearance: none; border: 0; background: none; color: var(--ink-2); padding: 11px 0 10px;
  font: 600 11px/1 var(--f-display); font-stretch: 75%; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer;
  border-bottom: 2px solid transparent;
}
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--tungsten); }
.tabs button:focus-visible { outline: 1px solid var(--focus); outline-offset: -3px; }
.panels { overflow-y: auto; min-height: 0; }
.panel { padding: 16px 18px 28px; display: grid; gap: 18px; }
.group { display: grid; gap: 10px; }
.group > h2 { margin: 0; font-size: 11px; font-stretch: 70%; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-2); display: flex; justify-content: space-between; }
.group > h2 small { font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.02em; text-transform: none; color: var(--tungsten-dim); font-weight: 400; }
.note { margin: 0; font-size: 12px; color: var(--ink-2); }

.row { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; }
.row label { font-size: 13px; color: var(--ink); }
.row output { font-family: var(--f-mono); font-size: 11px; color: var(--ink-2); font-variant-numeric: tabular-nums; min-width: 6ch; text-align: right; }
.row input[type=range] { grid-column: 1 / -1; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: none; margin: 0; cursor: pointer; }
input[type=range]::-webkit-slider-runnable-track { height: 2px; background: linear-gradient(90deg, var(--tungsten) var(--p, 50%), var(--line) var(--p, 50%)); }
input[type=range]::-moz-range-track { height: 2px; background: var(--line); }
input[type=range]::-moz-range-progress { height: 2px; background: var(--tungsten); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; margin-top: -5px; border-radius: 50%; background: var(--ink); border: 0; }
input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--ink); border: 0; }
input[type=range]:focus-visible { outline: 1px solid var(--focus); outline-offset: 2px; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  appearance: none; border: 1px solid var(--line); background: var(--rail-2); color: var(--ink);
  font: 500 12px/1 var(--f-display); padding: 7px 10px; border-radius: 3px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center;
}
.chip[aria-pressed="true"] { border-color: var(--tungsten); color: var(--focus); }
.chip:hover { border-color: #46424c; }
.chip:focus-visible { outline: 1px solid var(--focus); outline-offset: 1px; }
.chip .sw { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn {
  appearance: none; border: 1px solid var(--tungsten); background: var(--tungsten); color: #1a1208;
  font: 650 12px/1 var(--f-display); font-stretch: 85%; letter-spacing: 0.08em; text-transform: uppercase; padding: 10px 14px; border-radius: 3px; cursor: pointer;
}
.btn.ghost { background: none; color: var(--ink); border-color: var(--line); }
.btn:focus-visible { outline: 1px solid var(--focus); outline-offset: 2px; }
.toggles { display: grid; gap: 8px; }
.toggle { display: flex; align-items: center; justify-content: space-between; font-size: 13px; cursor: pointer; }
.toggle input { appearance: none; width: 30px; height: 16px; border-radius: 9px; background: var(--line); position: relative; cursor: pointer; margin: 0; transition: background .15s; }
.toggle input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--ink-2); transition: transform .15s, background .15s; }
.toggle input:checked { background: var(--tungsten-dim); }
.toggle input:checked::after { transform: translateX(14px); background: var(--focus); }
.toggle input:focus-visible { outline: 1px solid var(--focus); outline-offset: 2px; }
.credits { font-size: 11px; color: var(--ink-2); border-top: 1px solid var(--line); padding-top: 12px; }
.credits a { color: var(--ink-2); }

@media (max-width: 760px) {
  :root { --rail-w: 0px; }
  #stage { inset: 0 0 42vh 0; }
  #rail { top: auto; left: 0; width: auto; height: 42vh; border-left: 0; border-top: 1px solid var(--line); padding-left: env(safe-area-inset-left, 0px); }
  .rail-head { display: none; }
  .panel { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .vf-top .read { gap: 10px; font-size: 11px; }
}
@media (prefers-reduced-motion: reduce) { #loading .lamp { animation: none; } }
</style>
</head>
<body>
<div id="stage">
  <canvas id="view" aria-label="Rendered 3D face. Drag to orbit, scroll or pinch to zoom."></canvas>
  <div class="frame-marks" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <div class="vf vf-top">
    <span class="name">Face <b>Simulator</b></span>
    <span class="read" id="readout">
      <span><strong id="ro-lens">85</strong> mm</span>
      <span>f/<strong id="ro-f">4</strong></span>
      <span>EV <strong id="ro-ev">0.0</strong></span>
      <span id="ro-light">Loft windows (HDRI)</span>
      <span><strong id="ro-fps">–</strong> fps</span>
    </span>
  </div>
  <div class="vf vf-bottom">Drag to orbit · scroll to zoom · the eyes follow your cursor</div>
  <div id="loading" role="status" aria-live="polite">
    <div class="box"><div class="lamp" aria-hidden="true"></div><div class="msg" id="loading-msg">Warming up the lights…</div><div class="err" id="loading-err" hidden></div></div>
  </div>
</div>

<aside id="rail" aria-label="Controls">
  <div class="rail-head">
    <h1>Synthetic identity · light-stage statistics</h1>
    <p>A procedurally generated person that does not exist, rendered with subsurface skin scattering.</p>
  </div>
  <div class="tabs" role="tablist" aria-label="Control groups">
    <button role="tab" id="tab-face" aria-controls="p-face" aria-selected="true">Face</button>
    <button role="tab" id="tab-expr" aria-controls="p-expr" aria-selected="false">Expression</button>
    <button role="tab" id="tab-skin" aria-controls="p-skin" aria-selected="false">Skin</button>
    <button role="tab" id="tab-eyes" aria-controls="p-eyes" aria-selected="false">Eyes</button>
    <button role="tab" id="tab-light" aria-controls="p-light" aria-selected="false">Light</button>
  </div>
  <div class="panels" id="panels"></div>
</aside>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
